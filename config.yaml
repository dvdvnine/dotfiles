config:
  create: true
  dotpath: auto

dotfiles:
  git:
    src: git
    dst: ~/.config/git
    link: link_children

  fish:
    src: fish
    dst: ~/.config/fish
    link: link_children

  starship:
    src: starship
    dst: ~/.config
    link: link_children

  ghostty:
    src: ghostty
    dst: ~/.config/ghostty
    link: link_children

  kitty:
    src: kitty
    dst: ~/.config/kitty
    link: link_children

  nano:
    src: nano
    dst: ~/.config/nano
    link: link_children

  vim:
    src: vim
    dst: ~/.config/vim
    link: link_children

  nvim:
    src: nvim
    dst: ~/.config/nvim
    link: link_children

  vscode:
    src: vscode
    dst: ~/.config/Code/User
    link: link_children

  zed:
    src: zed
    dst: ~/.config/zed
    link: link_children

  f_secure_sensitive:
    src: bin/secure-sensitive
    dst: ~/.local/bin/secure-sensitive
    link: absolute

  f_set_mode:
    src: bin/set-mode
    dst: ~/.local/bin/set-mode
    link: absolute

  f_set_wallpaper:
    src: bin/set-wallpaper
    dst: ~/.local/bin/set-wallpaper
    link: absolute

  f_tui_app:
    src: bin/tui-app
    dst: ~/.local/bin/tui-app
    link: absolute

  f_toggle_dnd:
    src: bin/toggle-dnd
    dst: ~/.local/bin/toggle-dnd
    link: absolute

  f_hypr_close_windows:
    src: bin/hypr-close-windows
    dst: ~/.local/bin/hypr-close-windows
    link: absolute

  f_hypr_lock_screen:
    src: bin/hypr-lock-screen
    dst: ~/.local/bin/hypr-lock-screen
    link: absolute

  f_hypr_session:
    src: bin/hyrp-session
    dst: ~/.local/bin/hypr-session
    link: absolute

  fontconfig:
    src: fontconfig
    dst: ~/.config/fontconfig
    link: link_children

  uwsm:
    src: uwsm
    dst: ~/.config/uwsm
    link: link_children

  waybar:
    src: waybar
    dst: ~/.config/waybar
    link: link_children

  walker:
    src: walker
    dst: ~/.config/walker
    link: link_children

  mako:
    src: mako
    dst: ~/.config/mako
    link: link_children

  hypr:
    src: hypr
    dst: ~/.config/hypr
    link: link_children

  hyprlock:
    src: hyprlock
    dst: ~/.config/hypr
    link: link_children

  hyprtoolkit:
    src: hyprtoolkit
    dst: ~/.config/hypr
    link: link_children

  noctalia:
    src: noctalia
    dst: ~/.config/noctalia
    link: link_children

profiles:
  base:
    dotfiles:
      - git
      - fish
      - starship
      - ghostty
      - nvim

  hyprland:
    dotfiles:
      - f_secure_sensitive
      - f_set_mode
      - f_tui_app
      - fontconfig
      - uwsm
      - hypr
      - noctalia
