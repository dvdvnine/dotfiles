config:
  create: true
  dotpath: auto

dotfiles:
  fish:
    src: fish
    dst: ~/.config/fish
    link: link_children

  starship:
    src: starship
    dst: ~/.config
    link: link_children

  ghostty:
    src: ghostty
    dst: ~/.config/ghostty
    link: link_children

  nvim:
    src: nvim
    dst: ~/.config/nvim
    link: link_children

  f_set_mode:
    src: bin/set-mode
    dst: ~/.local/bin/set-mode
    link: absolute


  uwsm:
    src: uwsm
    dst: ~/.config/uwsm
    link: link_children

  hypr:
    src: hypr
    dst: ~/.config/hypr
    link: link_children

  noctalia:
    src: noctalia
    dst: ~/.config/noctalia
    link: link_children

profiles:
  base:
    dotfiles:
      - fish
      - starship
      - ghostty
      - nvim

  hyprland:
    dotfiles:
      - f_set_mode
      - uwsm
      - hypr
      - noctalia
