- defaults:
    link:
      create: true
      relink: true

- clean:
    ~/.local/bin/:
    ~/.config/:
      recursive: true

- link:
    ~/.ssh/config: auto/ssh/config

    ~/.config/git/:
      glob: true
      path: auto/git/*

    ~/.config/mise/config.toml: auto/mise/config.toml

    ~/.config/fish/:
      glob: true
      path: auto/fish/*

    ~/.config/nvim/:
      glob: true
      path: auto/nvim/*

    ~/.config/starship.toml: auto/starship/starship.toml

    ~/.config/ghostty/config: auto/ghostty/config

    ~/.config/fontconfig/fonts.conf: auto/fontconfig/fonts.conf

    ~/.local/bin/secure-sensitive: auto/bin/secure-sensitive
    ~/.local/bin/set-mode: auto/bin/set-mode
    ~/.local/bin/tui-app: auto/bin/tui-app

    ~/.config/noctalia/:
      glob: true
      path: auto/noctalia/*

    ~/.config/niri/:
      glob: true
      path: auto/niri/*
      exclude:
        - auto/niri/profiles
    ~/.config/niri/profiles/desktop.kdl:
      if: '[ "$(hostname)" = "desktop" ]'
      path: auto/niri/profiles/desktop.kdl
    ~/.config/niri/profiles/laptop.kdl:
      if: '[ "$(hostname)" = "laptop" ]'
      path: auto/niri/profiles/laptop.kdl

- shell:
    - command: echo
      quiet: true
      stdout: true

    - [chmod 700 ~/.ssh, " 🛡️ Securing `~/.ssh`"]
    - [chmod 600 ~/.ssh/config, " 🛡️ Securing SSH config"]

    - [systemctl enable --user gcr-ssh-agent.socket, " 🔑 Enabling SSH agent"]
    - [systemctl enable --user app-com.mitchellh.ghostty.service, " 🔑 Enabling 'Ghostty' to run in backgroun"]

    - [sudo systemctl enable ly@tty2.service, " 🖥️ Enabling 'Ly'"]
    - [sudo systemctl disable getty@tty2.service, " 🖥️ Disabling 'getty' on TTY"]

    - [sudo systemctl enable docker.socket, " 🐳 Enabling 'Docker' socket"]
    - [sudo usermod -aG docker "$USER", " 🐳 Adding user to 'Docker' group"]

    - [chsh -s /usr/bin/fish, " 🐟 Setting 'Fish' as default shell"]
