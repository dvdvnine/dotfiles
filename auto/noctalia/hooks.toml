[hooks]
started = 'set-mode "$(noctalia msg theme-mode-get)"'
theme_mode_changed = 'set-mode "$NOCTALIA_THEME_MODE"'

session_locked = "secure-sensitive; hyprctl switchxkblayout all 0 >/dev/null 2>&1"
rebooting = "command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown"
shutting_down = "command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown"
